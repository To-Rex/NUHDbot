{# Live chat: no polling — admin.js appends new messages when the support stream says so. #}
<div class="chat" id="chat" data-thread="{{ th.id }}">
{% with items=th.messages %}{% include "admin/support/_msg_items.html" %}{% endwith %}{% if not th.messages %}<div class="empty" data-chat-empty>{{ icon('message', 26) }}<b>{{ t('admin.sup.no_messages') }}</b></div>{% endif %}
</div>
