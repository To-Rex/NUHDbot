<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ t('admin.login_title') }} · {{ app_name }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"><link rel="stylesheet" href="/static/css/admin.css?v=1"></head>
<body><div class="login-wrap"><form class="card login-card stack" method="post" action="/admin/login">
  <div class="row" style="gap:12px;margin-bottom:6px"><img src="/static/img/logo.svg" width="44" height="44" alt=""><div><div class="bold" style="font-size:17px">{{ app_name }}</div><div class="small muted">{{ t('admin.login_title') }}</div></div></div>
  {% if error %}<div class="notice notice-bad">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label>{{ t('admin.login') }}</label><input class="input" name="login" value="{{ login or '' }}" autofocus autocomplete="username" required></div>
  <div class="field"><label>{{ t('admin.password') }}</label><input class="input" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn-primary btn-lg" style="width:100%">{{ t('admin.sign_in') }}</button>
</form></div></body></html>
