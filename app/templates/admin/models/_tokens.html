{# Model chips: type a model and press Enter (or paste a list); admin.js keeps the hidden `lines` textarea in sync. #}
<div class="tokens" data-model-tokens>
  <input class="tokens-input" data-token-input placeholder="{{ t('admin.models.tokens_ph') }}" autocomplete="off" spellcheck="false" enterkeyhint="enter" aria-label="{{ t('admin.models.lines') }}">
  <textarea name="lines" hidden></textarea>
</div>
