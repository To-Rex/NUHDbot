<div class="field"><label>{{ t('admin.prod.title') }} <span class="req">*</span></label><input class="input" name="title" value="{{ post.title }}" required></div>
<div class="field"><label>{{ t('admin.ads.text') }} <span class="req">*</span></label><textarea class="textarea" name="text" rows="5" required>{{ post.text }}</textarea></div>
<div class="form-grid"><div class="field"><label>{{ t('admin.ads.campaign') }}</label><input class="input mono" name="campaign" value="{{ post.campaign }}" pattern="[A-Za-z0-9_-]+"><span class="hint">?startapp=src_…</span></div><div class="field"><label>{{ t('admin.ads.targets') }}</label><input class="input mono" name="targets" value="{{ post.target_chat_ids|join(', ') }}" placeholder="-1001234567890, -100987654321"></div></div>
<div class="field"><label>{{ t('admin.ads.products') }}</label><select class="select" name="product_ids" multiple size="8" style="height:auto;padding:6px">{% for p in products %}<option value="{{ p.id }}" {{ 'selected' if p.id in post.product_ids }}>{{ p.brand }} {{ p.model }} · {{ p.capacity_gb|capacity }} · {{ p.condition.value|upper }} · {{ p.price|money(p.currency) }}</option>{% endfor %}</select><span class="hint">{{ t('admin.ads.need_products') }}</span></div>
