{% extends "admin/base.html" %}
{% block topbar_actions %}<a class="btn btn-secondary btn-sm" href="/admin/ads">{{ icon('chevron-left', 15) }}{{ t('admin.back') }}</a>{% endblock %}
{% block content %}
{% if errors %}<div class="notice notice-bad mb">{{ icon('alert', 18) }}<span>{{ errors|join(', ') }}</span></div>{% endif %}
<form method="post" class="fsection stack" style="max-width:760px" data-track><input type="hidden" name="_csrf" value="{{ csrf }}">{% include "admin/ads/_form_fields.html" %}<div><button class="btn btn-primary">{{ icon('plus', 16) }}{{ t('admin.create') }}</button></div></form>
{% endblock %}
