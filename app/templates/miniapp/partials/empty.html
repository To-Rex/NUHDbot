<div class="empty">
  <div class="glyph">{{ icon(glyph or 'package', 26) }}</div>
  <h3>{{ title or t('common.empty') }}</h3>
  {% if text %}<p class="small">{{ text }}</p>{% endif %}
  {% if cta_url %}<a class="btn btn-secondary btn-sm mt-4" href="{{ cta_url }}">{{ cta_text }}</a>{% endif %}
</div>
