<select class="select" name="city" id="city" onchange="document.getElementById('city-other').hidden = this.value !== '__other__'">
  {% for c in cities %}<option value="{{ c.name.en }}" {{ 'selected' if selected == c.name.en }}>{{ p(c.name) }}</option>{% endfor %}
  <option value="__other__" {{ 'selected' if (selected and cities and selected not in cities|map(attribute='name.en')|list) or not cities }}>{{ t('register.city_other') }}</option>
</select>
