{% extends "miniapp/base.html" %}
{% block title %}{{ page_title }} · {{ app_name }}{% endblock %}
{% block topbar_actions %}{% endblock %}
{% block content %}
<div class="page">
  <form class="card stack" method="post" action="/app/profile/edit" hx-boost="true" hx-target="body">
    <div class="grid-2"><div class="field"><label>{{ t('register.first_name') }}</label><input class="input" name="first_name" value="{{ user.first_name }}" required></div><div class="field"><label>{{ t('register.last_name') }}</label><input class="input" name="last_name" value="{{ user.last_name }}"></div></div>
    <div class="field"><label>{{ t('register.phone') }}</label><input class="input mono" name="phone" type="tel" value="{{ user.phone or '' }}"><span class="hint">{{ t('register.phone_hint') }}</span></div>
    <div class="grid-2"><div class="field"><label>{{ t('register.country') }}</label><select class="select" name="country">{% for c in countries %}<option value="{{ c.code }}" {{ 'selected' if c.code == user.country }}>{{ p(c.name) }}</option>{% endfor %}</select></div><div class="field"><label>{{ t('register.city') }}</label><input class="input" name="city" value="{{ user.city or '' }}"></div></div>
    <div class="field"><label>{{ t('register.language') }}</label><div class="segmented">{% for code in ('uz','ru','en') %}<label style="flex:1"><input type="radio" name="ui_lang" value="{{ code }}" class="sr-only" {{ 'checked' if user.lang == code }}><span class="seg {{ 'active' if user.lang == code }}">{{ t('lang.' ~ code) }}</span></label>{% endfor %}</div></div>
    <label class="row-between" style="padding:6px 0"><span class="semibold">{{ t('register.ads') }}</span><input type="checkbox" name="ads_opt_in" value="1" class="sr-only" {{ 'checked' if user.ads_opt_in }}><span class="toggle"></span></label>
    <button class="btn btn-primary btn-lg btn-block"><span class="label">{{ t('common.save') }}</span><span class="spinner"></span></button>
  </form>
</div>
{% endblock %}
{% block scripts %}<script>document.addEventListener('change', function(e){ if (e.target.name === 'ui_lang') document.querySelectorAll('.seg').forEach(function(s){ s.classList.toggle('active', s.previousElementSibling.checked); }); });</script>{% endblock %}
