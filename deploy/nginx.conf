# nginx site for nuhdbot. Obtain certs with certbot: certbot --nginx -d hdd.example.com
server {
    listen 80;
    server_name hdd.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name hdd.example.com;
    ssl_certificate     /etc/letsencrypt/live/hdd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hdd.example.com/privkey.pem;
    client_max_body_size 20m;

    location /static/ {
        alias /opt/nuhdbot/app/static/;
        expires 30d;
        add_header Cache-Control "public";
    }
    location /api/auctions/ {            # SSE: disable buffering
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
